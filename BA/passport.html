<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="季節の豆">
<title>コーヒーパスポート 季節限定・リザーブの豆まとめ</title>
<style>
  :root {
    --green: #00704a;
    --green-dark: #1e3932;
    --green-light: #d4e9e2;
    --cream: #f2f0eb;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --blonde: #d9a441;
    --medium: #9a6233;
    --dark: #4a2c1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--cream);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  header {
    background: var(--green-dark);
    color: #fff;
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .8; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .bar button {
    font: inherit; font-size: 14px;
    border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff;
    border-radius: 999px; padding: 6px 14px;
  }
  .bar button.on { background: #fff; color: var(--green-dark); }
  main { padding: 16px 16px 40px; max-width: 1400px; margin: 0 auto; }
  h2 {
    font-size: 17px; margin: 22px 0 8px; color: var(--green-dark);
    border-left: 5px solid var(--green); padding-left: 8px;
  }
  h2 small { font-weight: normal; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .wrap { overflow-x: auto; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  table { border-collapse: collapse; width: 100%; min-width: 1100px; font-size: 14px; }
  th, td { padding: 10px 10px; border-bottom: 1px solid #e6e3dc; text-align: left; vertical-align: top; }
  th { background: var(--green-light); color: var(--green-dark); font-size: 13px; white-space: nowrap; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  td.name { font-weight: bold; min-width: 170px; position: sticky; left: 0; background: #fff; }
  th.name { position: sticky; left: 0; z-index: 2; }
  td.date { white-space: nowrap; color: var(--muted); }
  td.notes { min-width: 200px; font-weight: bold; color: var(--green-dark); }
  td.pair { min-width: 150px; }
  td.origin { min-width: 130px; }
  td.proc { min-width: 110px; }
  .roast { display: inline-block; padding: 2px 10px; border-radius: 999px; color: #fff; font-size: 12px; white-space: nowrap; }
  .roast.b { background: var(--blonde); }
  .roast.m { background: var(--medium); }
  .roast.d { background: var(--dark); }
  .roast.r { background: #222; }
  .lv { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 6px; }
  .lv i { width: 12px; height: 8px; border-radius: 2px; background: #e2ddd2; display: block; }
  .lv i.f { background: var(--green); }
  .lvtxt { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .tag { display: inline-block; font-size: 11px; background: #f6e7c8; color: #7a5410; border-radius: 4px; padding: 1px 6px; margin-left: 4px; font-weight: normal; vertical-align: 1px; }
  .sub { display: block; font-weight: normal; font-size: 12px; color: var(--muted); margin-top: 3px; }
  /* 暗記用：かくす */
  .hidden-cell { cursor: pointer; }
  body.hide-notes td.notes > .v,
  body.hide-pair td.pair > .v,
  body.hide-origin td.origin > .v { visibility: hidden; }
  body.hide-notes td.notes,
  body.hide-pair td.pair,
  body.hide-origin td.origin { background: repeating-linear-gradient(45deg, #f4f1ea, #f4f1ea 6px, #ece8de 6px, #ece8de 12px); }
  td.peek > .v { visibility: visible !important; }
  .note { font-size: 13px; color: var(--muted); line-height: 1.7; margin-top: 18px; }
  .note a { color: var(--green); }
  td.pkg { width: 150px; min-width: 150px; }
  td.pkg a { display: block; width: 130px; height: 150px; overflow: hidden; border-radius: 8px; background: #f7f5f0; }
  td.pkg img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.4); }
  td.pkg .cap { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 6px; display: block; }
  td.pkg .noimg { width: 130px; height: 130px; border-radius: 8px; background: #f7f5f0; color: var(--muted); font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; }
  body.hide-pkg td.pkg > .v { visibility: hidden; }
  body.hide-pkg td.pkg { background: repeating-linear-gradient(45deg, #f4f1ea, #f4f1ea 6px, #ece8de 6px, #ece8de 12px); }
  h2.reserve { border-left-color: #222; }
</style>
</head>

      ・「頃」の付いた発売月はレビュー記事の日付からの推定です。リザーブは今販売中のものだけで、2026年中に販売が終わったものは入っていません。<br>
      ・新作一覧に「ウガンダ マウント エルゴン」が載っているサイトもありましたが、公式の情報が見つからなかったので入れていません。<br>
      ・参考：<a href="https://ippu-web.com/coffee/review/starbucks/seasonal/seasonal-fy26">季節限定コーヒーまとめ FY26版</a>／
      <a href="https://product.starbucks.co.jp/beans/seasonal/">公式 SEASONAL COFFEE</a>／
      <a href="https://product.starbucks.co.jp/beans/reserve/">公式 スターバックス リザーブ®</a>（2026年11月7日時点）
    </p>`;

  document.querySelectorAll('.bar button').forEach((b) => {
    b.onclick = () => {
      b.classList.toggle('on');
      document.body.classList.toggle('hide-' + b.dataset.hide, b.classList.contains('on'));
      document.querySelectorAll('.peek').forEach((c) => c.classList.remove('peek'));
    };
  });
  // かくしている列のマスをタップしたら、そのマスだけ見せる（かくしていない時は画像リンクをそのまま開く）
  document.addEventListener('click', (e) => {
    const c = e.target.closest('.hidden-cell');
    if (!c) return;
    const col = [...c.classList].find((k) => ['notes', 'pair', 'origin', 'pkg'].includes(k));
    if (document.body.classList.contains('hide-' + col) && !c.classList.contains('peek')) {
      e.preventDefault();
      c.classList.add('peek');
    } else if (document.body.classList.contains('hide-' + col)) {
      if (e.target.closest('a')) return;
      c.classList.remove('peek');
    }
  });
</script>
