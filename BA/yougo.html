<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="用語ノート">
<title>BA 用語ノート</title>
<style>
  :root {
    --green: #00704a;
    --green-dark: #1e3932;
    --green-light: #d4e9e2;
    --cream: #f2f0eb;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --line: #e6e3dc;
    --gold: #cba258;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--cream);
    color: var(--text);
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }
  header {
    background: var(--green-dark); color: #fff;
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { margin: 0; font-size: 20px; line-height: 1.4; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .8; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .tools input {
    font: inherit; font-size: 15px; border: none; border-radius: 999px;
    padding: 7px 14px; width: 220px; max-width: 100%;
  }
  .tools button {
    font: inherit; font-size: 14px; border: 1px solid rgba(255,255,255,.5);
    background: transparent; color: #fff; border-radius: 999px; padding: 5px 13px;
  }
  .tools button.on { background: #fff; color: var(--green-dark); }
  main { max-width: 980px; margin: 0 auto; padding: 16px 16px 60px; }
  .card {
    background: #fff; border-radius: 14px; padding: 18px 20px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .card h2 { margin: 0; font-size: 21px; color: var(--green-dark); line-height: 1.4; }
  .card h2 .en { font-size: 14px; color: var(--muted); font-weight: normal; margin-left: 8px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cat { display: inline-block; font-size: 11px; background: var(--green-light); color: var(--green-dark); border-radius: 4px; padding: 0 7px; margin-right: 6px; }
  .short {
    margin: 12px 0 0; padding: 10px 14px; background: #f6f3ec; border-left: 4px solid var(--green);
    border-radius: 6px; font-weight: bold;
  }
  .card h3 { font-size: 14px; color: var(--green); margin: 16px 0 4px; }
  .card ul, .card ol { margin: 4px 0; padding-left: 1.4em; }
  .card li { margin: 2px 0; }
  .tip { margin-top: 14px; padding: 10px 14px; background: #fdf6e6; border-radius: 8px; font-size: 14px; }
  .tip b { color: #8a5d0a; }
  .vs { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
  .vs th, .vs td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
  .vs th { background: var(--green-light); color: var(--green-dark); font-size: 13px; }
  .vs td:first-child { white-space: nowrap; font-weight: bold; color: var(--muted); font-size: 13px; }
  .photos { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .photos figure { margin: 0; width: 200px; }
  .photos img { width: 200px; height: 150px; object-fit: cover; border-radius: 8px; display: block; background: #eee; }
  .photos figcaption { font-size: 12px; line-height: 1.5; margin-top: 4px; }
  .photos .credit { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
  .photos .credit a { color: var(--muted); }
  .flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; font-size: 14px; }
  .flow span { background: #f6f3ec; border-radius: 6px; padding: 3px 9px; }
  .flow span.k { background: var(--green); color: #fff; }
  .flow i { color: var(--muted); font-style: normal; }
  /* フレーバーホイール */
  .wheel-guide { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 10px; }
  details.fw { border-radius: 10px; border: 1px solid var(--line); overflow: hidden; background: #fff; }
  details.fw summary {
    list-style: none; cursor: pointer; padding: 10px 14px; color: #fff; font-weight: bold;
    display: flex; justify-content: space-between; align-items: center;
  }
  details.fw summary::-webkit-details-marker { display: none; }
  details.fw summary small { font-weight: normal; opacity: .85; font-size: 12px; }
  details.fw summary::after { content: '＋'; font-weight: normal; }
  details.fw[open] summary::after { content: '－'; }
  .fw-body { padding: 8px 14px 12px; font-size: 14px; }
  .fw-body .t2 { font-weight: bold; margin-top: 6px; }
  .fw-body .t2 small { color: var(--muted); font-weight: normal; }
  .fw-body .t3 { display: flex; flex-wrap: wrap; gap: 4px; margin: 3px 0 2px; }
  .fw-body .t3 span { font-size: 12px; background: #f4f1ea; border-radius: 4px; padding: 1px 7px; }
  .fw-body .t3 span small { color: var(--muted); }
  .quiz-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .quiz-row button {
    font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  .quiz-row button.ok { background: var(--green); color: #fff; border-color: var(--green); }
  .quiz-row button.ng { background: #f7d9dd; border-color: #e8a5ae; }
  #quiz-q { font-weight: bold; margin-top: 6px; }
  #quiz-a { font-size: 14px; color: var(--muted); min-height: 1.5em; margin-top: 6px; }
  .hide-ans .ans { color: transparent; background: repeating-linear-gradient(45deg, #f4f1ea, #f4f1ea 6px, #ece8de 6px, #ece8de 12px); border-radius: 4px; cursor: pointer; }
  .hide-ans .ans.peek { color: inherit; background: none; }
  .cups { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 10px 0 4px; }
  .cupfig { margin: 0; width: 220px; max-width: 100%; color: var(--text); }
  .cupfig svg { width: 100%; height: auto; display: block; }
  .cupfig figcaption { font-size: 13px; font-weight: bold; color: var(--green-dark); padding-left: 22px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  .foot { font-size: 12px; color: var(--muted); margin-top: 24px; line-height: 1.7; }
  .foot a { color: var(--green); }
</style>
</head>
<body>
<header>
  <h1>BA 用語ノート</h1>
  <p>わからない用語・覚えにくいところのまとめ。新しい用語はどんどん追加していきます。</p>
  <div class="tools">
    <input id="q" type="search" placeholder="用語をさがす">
    <button id="hide">「一言で」をかくす</button>
  </div>
  <div class="tools" id="cats"></div>
</header>
<main id="main"></main>

<script>
  // ───────── 用語データ（新しい用語はここに追加） ─────────
  // photo: Wikimedia Commons の写真（ライセンスとクレジットを表示）
  const WM = (path) => `https://upload.wikimedia.org/wikipedia/commons/${path}`;
  // ───────── ドリンクの断面図（下の層から順に [名前, 色, 高さの比率]） ─────────
  const C = { esp: '#4a2a1a', drip: '#7a4a2c', milk: '#f4ecdc', mix: '#b38b68', ice: '#f6ecc8', cream: '#fffdf6', protein: '#eadfcc' };
  let cupN = 0;
  function cup(name, layers, scale = 1, ice = false) {
    const id = 'cup' + (cupN++);
    const bot = 140, h = Math.round(120 * scale), top = bot - h;
    const inset = 8 * scale; // 下ほど細いグラス
    const glass = `16,${top} 96,${top} ${96 - inset},${bot} ${16 + inset},${bot}`;
    const total = layers.reduce((s, l) => s + l[2], 0);
    const fillH = h * 0.86;
    let y = bot, rects = '', labels = '', lastY = 999;
    layers.forEach(([label, color, v]) => {
      const lh = (fillH * v) / total;
      y -= lh;
      rects += `<rect x="0" y="${y}" width="120" height="${lh}" fill="${color}"/>`;
      let cy = y + lh / 2;
      if (cy > lastY - 15) cy = lastY - 15; // ラベルが重ならないように
      lastY = cy;
      labels += `<line x1="92" y1="${cy}" x2="106" y2="${cy}" stroke="currentColor" stroke-width="1" opacity=".5"/><text x="110" y="${cy + 4}" font-size="12" fill="currentColor">${label}</text>`;
    });
    const cubes = ice ? [[30, bot - 40], [58, bot - 62], [40, bot - 85]].map(([x, yy]) => `<rect x="${x}" y="${yy}" width="20" height="18" rx="3" fill="#fff" opacity=".45"/>`).join('') : '';
    return `<figure class="cupfig"><svg viewBox="0 ${top - 6} 260 ${h + 10}" role="img" aria-label="${name}の断面図">
      <defs><clipPath id="${id}"><polygon points="${glass}"/></clipPath></defs>
      <g clip-path="url(#${id})">${rects}${cubes}</g>
      <polygon points="${glass}" fill="none" stroke="#9a9a9a" stroke-width="2"/>
      ${labels}</svg><figcaption>${name}</figcaption></figure>`;
  }

  const entries = [
    {
      id: 'wetmill', term: 'ウェットミル', en: 'Wet Mill', cat: '生産・精製', added: '2026-11-07',
      short: '収穫したコーヒーチェリーから果肉をとり、洗って乾かして「パーチメントコーヒー」にする場所。',
      html: `
        <h3>ここでやること（水洗式の場合）</h3>
        <div class="flow"><span>チェリーの受け入れ</span><i>→</i><span>果肉をとる（パルピング）</span><i>→</i><span>発酵・粘液をとる</span><i>→</i><span>水で洗う</span><i>→</i><span>乾燥</span><i>→</i><span class="k">パーチメントコーヒー</span></div>
        <ul>
          <li>「ウェット（水）」の名前のとおり、<b>水をたくさん使う工程</b>が中心。</li>
          <li>農園の近くにあることが多い。チェリーは収穫後すぐに傷み始めるので、<b>収穫したらすぐ</b>運び込む。</li>
          <li>ここから出ていくのは、薄い殻（パーチメント）に包まれたままの豆。</li>
        </ul>
        <h3>用語メモ</h3>
        <ul>
          <li><b>パーチメント</b>：生豆を包んでいる薄い殻。羊皮紙（パーチメント）のような見た目からこの名前。</li>
          <li><b>パルパー（デパルパー）</b>：果肉をはぎとる機械。手回し式はハンドパルパー。</li>
          <li><b>ミューシレージ</b>：果肉をとったあと豆のまわりに残る、ぬるぬるした粘液。</li>
        </ul>`,
      tip: '<b>覚え方：</b>ウェット＝<b>濡れる</b>工程。「果肉をとって洗う」まで。殻（パーチメント）はまだ付いたまま。',
      photos: [
        { src: WM('thumb/d/d4/Coffee_Pulping_Machine_with_Washing_Tank_-_Tanzania.jpg/500px-Coffee_Pulping_Machine_with_Washing_Tank_-_Tanzania.jpg'), cap: '果肉をとる機械と洗浄タンク（タンザニア）', credit: 'Harald Ulver / CC BY-SA 4.0', page: 'https://commons.wikimedia.org/wiki/File:Coffee_Pulping_Machine_with_Washing_Tank_-_Tanzania.jpg' },
        { src: WM('thumb/2/26/Coffee_hulling.jpg/500px-Coffee_hulling.jpg'), cap: '手回し式のパルパー。下のたらいに赤いチェリー', credit: 'Vincent Mugaba / CC BY-SA 4.0', page: 'https://commons.wikimedia.org/wiki/File:Coffee_hulling.jpg' },
        { src: WM('thumb/0/09/Coffee_Drying_on_concrete_Patio.jpg/500px-Coffee_Drying_on_concrete_Patio.jpg'), cap: 'パティオ（乾燥場）で豆を乾かしているところ', credit: 'Ron / Public domain', page: 'https://commons.wikimedia.org/wiki/File:Coffee_Drying_on_concrete_Patio.jpg' },
      ],
      related: ['drymill', 'process'],
    },
    {
      id: 'drymill', term: 'ドライミル', en: 'Dry Mill', cat: '生産・精製', added: '2026-11-07',
      short: 'パーチメント（殻）や乾いた果皮をはがして、大きさ・重さ・色で選別し、輸出できる「生豆」にする場所。',
      html: `
        <h3>ここでやること</h3>
        <div class="flow"><span>パーチメントコーヒー<br>（または乾燥したチェリー）</span><i>→</i><span>殻をはがす（脱殻）</span><i>→</i><span>選別<br>大きさ・重さ・色</span><i>→</i><span>格付け</span><i>→</i><span>麻袋に詰める</span><i>→</i><span class="k">生豆として輸出</span></div>
        <ul>
          <li>水はほとんど使わない、<b>乾いた状態の工程</b>。</li>
          <li><b>どの加工法の豆も、最後はドライミルを通る</b>。水洗式はパーチメントを、乾燥式（ナチュラル）は乾いた果皮ごとはがす。</li>
          <li>欠点豆（割れ・虫食い・黒い豆など）をここで取り除く。品質を決める大事な工程。</li>
        </ul>
        <h3>ウェットミルとのちがい</h3>
        <table class="vs">
          <tr><th></th><th>ウェットミル</th><th>ドライミル</th></tr>
          <tr><td>入ってくるもの</td><td>収穫したての赤いチェリー</td><td>乾いたパーチメントコーヒー／乾燥チェリー</td></tr>
          <tr><td>主な作業</td><td>果肉をとる・発酵・洗う・乾かす</td><td>殻をはがす・選別・格付け・袋詰め</td></tr>
          <tr><td>出ていくもの</td><td>パーチメントコーヒー</td><td>生豆（グリーンコーヒー）</td></tr>
          <tr><td>水</td><td>たくさん使う</td><td>ほとんど使わない</td></tr>
        </table>
        <ul style="margin-top:10px">
          <li>スターバックスの自社農園<b>ハシエンダ アルサシア</b>（コスタリカ）には、ウェットミルとドライミルの両方がある。</li>
        </ul>`,
      tip: '<b>覚え方：</b>ドライ＝<b>乾いてから</b>の工程。「殻をむいて、選んで、袋に詰める」。順番は必ず<b>ウェット → ドライ</b>。',
      photos: [
        { src: WM('thumb/e/e6/Colombian_Parchment_Coffee.jpg/500px-Colombian_Parchment_Coffee.jpg'), cap: 'パーチメントコーヒー。ドライミルに入る前の状態', credit: 'Felipe Quijano / CC BY-SA 4.0', page: 'https://commons.wikimedia.org/wiki/File:Colombian_Parchment_Coffee.jpg' },
      ],
      related: ['wetmill', 'process'],
    },
    {
      id: 'process', term: '加工法（水洗式・半水洗式・乾燥式）', en: 'Washed / Semi-washed / Natural', cat: '生産・精製', added: '2026-11-07',
      short: 'コーヒーチェリーから「種（生豆）」を取り出すやり方。どの皮を、いつ、どうやってはがすかがちがう。',
      html: `
        <h3>まずはチェリーの中身を知る</h3>
        <p style="margin:0 0 6px;font-size:14px">コーヒー豆は、さくらんぼのような実（チェリー）の<b>種</b>。外から順に、何枚も皮に包まれています。加工法は「この皮を、どの順番で、どうやってはがすか」のちがいです。</p>
        <svg viewBox="0 0 560 250" style="width:100%;max-width:560px;display:block" role="img" aria-label="コーヒーチェリーの断面図">
          <circle cx="125" cy="125" r="112" fill="#c8102e"/>
          <circle cx="125" cy="125" r="101" fill="#f2a58e"/>
          <circle cx="125" cy="125" r="84" fill="#fbe3bf"/>
          <ellipse cx="94" cy="125" rx="36" ry="66" fill="#f4ead3" stroke="#c9ad7a" stroke-width="3"/>
          <ellipse cx="156" cy="125" rx="36" ry="66" fill="#f4ead3" stroke="#c9ad7a" stroke-width="3"/>
          <ellipse cx="94" cy="125" rx="29" ry="58" fill="#9db37f" stroke="#c7cfd2" stroke-width="2.5"/>
          <ellipse cx="156" cy="125" rx="29" ry="58" fill="#9db37f" stroke="#c7cfd2" stroke-width="2.5"/>
          <g font-size="15" fill="#1f1f1f" font-family="-apple-system, Hiragino Sans, sans-serif">
            <line x1="205" y1="55" x2="300" y2="30" stroke="#999"/><text x="306" y="35"><tspan font-weight="bold" fill="#c8102e">① 果皮</tspan>　いちばん外の赤い皮</text>
            <line x1="205" y1="85" x2="300" y2="70" stroke="#999"/><text x="306" y="75"><tspan font-weight="bold" fill="#d9705a">② 果肉</tspan>　甘い実の部分（パルプ）</text>
            <line x1="196" y1="110" x2="300" y2="110" stroke="#999"/><text x="306" y="115"><tspan font-weight="bold" fill="#b5893a">③ ミューシレージ</tspan>　ぬるぬるの粘液</text>
            <line x1="186" y1="150" x2="300" y2="150" stroke="#999"/><text x="306" y="155"><tspan font-weight="bold" fill="#9a7b45">④ パーチメント</tspan>　うすい殻</text>
            <line x1="165" y1="180" x2="300" y2="190" stroke="#999"/><text x="306" y="195"><tspan font-weight="bold" fill="#7d8a8f">⑤ シルバースキン</tspan>　銀色のうす皮</text>
            <line x1="150" y1="150" x2="300" y2="230" stroke="#999"/><text x="306" y="235"><tspan font-weight="bold" fill="#5f7a45">⑥ 生豆</tspan>　これがコーヒー豆（種）</text>
          </g>
        </svg>

        <h3>3つの加工法を並べると</h3>
        <table class="vs">
          <tr><th></th><th>水洗式<br><small>ウォッシュト</small></th><th>半水洗式<br><small>ウェットハル式</small></th><th>乾燥式<br><small>ナチュラル</small></th></tr>
          <tr><td>ひとことで</td><td>果肉を<b>先にとって、洗ってから</b>干す</td><td>果肉をとって、<b>半乾きのうちに殻をむいて</b>から干す</td><td>実を<b>まるごと</b>干す</td></tr>
          <tr><td>イメージ</td><td>皮をむいて洗ったものを干す</td><td>生乾きで殻をむき、豆をむき出しで仕上げ干し</td><td>干し柿・ドライフルーツのように実ごと干す</td></tr>
          <tr><td>水</td><td>たくさん使う</td><td>少し使う</td><td>ほとんど使わない</td></tr>
          <tr><td>風味の傾向</td><td><b>すっきり・明るい酸味</b>。産地の個性がはっきり出る</td><td><b>ハーブ・大地のような風味</b>、どっしりしたコク、酸味はひかえめ</td><td><b>フルーティー</b>（ベリー・ワインのよう）、甘みと重めのコク</td></tr>
          <tr><td>よく使われる所</td><td>ラテンアメリカ、東アフリカ（ケニアなど）</td><td>インドネシア（スマトラなど）</td><td>エチオピア、ブラジル、雨の少ない地域</td></tr>
          <tr><td>スターバックスの例</td><td>グアテマラ カシ シエロ、ハシエンダ アルサシア、タンザニア モンデュール</td><td>スマトラ（クリスマス ブレンドのエイジド スマトラも）</td><td>サンドライド コスタリカ、サンドライド ケニア（リザーブ）</td></tr>
        </table>

        <h3>皮をはがす順番</h3>
        <p style="margin:0;font-size:14px"><b>水洗式</b></p>
        <div class="flow"><span>① 果皮＋② 果肉をパルパーでとる</span><i>→</i><span>③ 粘液を発酵させて水で洗い流す</span><i>→</i><span>④ 殻つきのまま乾燥</span><i>→</i><span class="k">ドライミルで ④ 殻をむく</span></div>
        <p style="margin:8px 0 0;font-size:14px"><b>半水洗式（ウェットハル式）</b></p>
        <div class="flow"><span>① 果皮＋② 果肉をとる</span><i>→</i><span>③ 粘液を短時間で洗う</span><i>→</i><span>少しだけ乾かす（半乾き）</span><i>→</i><span>④ 殻を<b>早めに</b>むく</span><i>→</i><span class="k">⑥ 豆がむき出しのまま仕上げ乾燥</span></div>
        <p style="margin:8px 0 0;font-size:14px"><b>乾燥式（ナチュラル）</b></p>
        <div class="flow"><span>何もはがさず<b>チェリーのまま</b>乾燥</span><i>→</i><span>カラカラになるまで何週間も干す</span><i>→</i><span class="k">ドライミルで ①〜④ をまとめてはがす</span></div>

        <h3>どうして味がちがうの？</h3>
        <ul>
