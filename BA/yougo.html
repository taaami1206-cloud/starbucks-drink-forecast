<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="用語ノート">
<title>BA 用語ノート</title>
<style>
  :root {
    --green: #00704a;
    --green-dark: #1e3932;
    --green-light: #d4e9e2;
    --cream: #f2f0eb;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --line: #e6e3dc;
    --gold: #cba258;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--cream);
    color: var(--text);
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }
  header {
    background: var(--green-dark); color: #fff;
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { margin: 0; font-size: 20px; line-height: 1.4; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .8; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .tools input {
    font: inherit; font-size: 15px; border: none; border-radius: 999px;
    padding: 7px 14px; width: 220px; max-width: 100%;
  }
  .tools button {
    font: inherit; font-size: 14px; border: 1px solid rgba(255,255,255,.5);
    background: transparent; color: #fff; border-radius: 999px; padding: 5px 13px;
  }
  .tools button.on { background: #fff; color: var(--green-dark); }
  main { max-width: 980px; margin: 0 auto; padding: 16px 16px 60px; }
  .card {
    background: #fff; border-radius: 14px; padding: 18px 20px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .card h2 { margin: 0; font-size: 21px; color: var(--green-dark); line-height: 1.4; }
  .card h2 .en { font-size: 14px; color: var(--muted); font-weight: normal; margin-left: 8px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cat { display: inline-block; font-size: 11px; background: var(--green-light); color: var(--green-dark); border-radius: 4px; padding: 0 7px; margin-right: 6px; }
  .short {
    margin: 12px 0 0; padding: 10px 14px; background: #f6f3ec; border-left: 4px solid var(--green);
    border-radius: 6px; font-weight: bold;
  }
  .card h3 { font-size: 14px; color: var(--green); margin: 16px 0 4px; }
  .card ul, .card ol { margin: 4px 0; padding-left: 1.4em; }
  .card li { margin: 2px 0; }
  .tip { margin-top: 14px; padding: 10px 14px; background: #fdf6e6; border-radius: 8px; font-size: 14px; }
  .tip b { color: #8a5d0a; }
  .vs { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
  .vs th, .vs td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
  .vs th { background: var(--green-light); color: var(--green-dark); font-size: 13px; }
  .vs td:first-child { white-space: nowrap; font-weight: bold; color: var(--muted); font-size: 13px; }
  .photos { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .photos figure { margin: 0; width: 200px; }
  .photos img { width: 200px; height: 150px; object-fit: cover; border-radius: 8px; display: block; background: #eee; }
  .photos figcaption { font-size: 12px; line-height: 1.5; margin-top: 4px; }
  .photos .credit { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
  .photos .credit a { color: var(--muted); }
  .flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; font-size: 14px; }
  .flow span { background: #f6f3ec; border-radius: 6px; padding: 3px 9px; }
  .flow span.k { background: var(--green); color: #fff; }
  .flow i { color: var(--muted); font-style: normal; }
  /* フレーバーホイール */
  .wheel-guide { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 10px; }
  details.fw { border-radius: 10px; border: 1px solid var(--line); overflow: hidden; background: #fff; }
  details.fw summary {
    list-style: none; cursor: pointer; padding: 10px 14px; color: #fff; font-weight: bold;
    display: flex; justify-content: space-between; align-items: center;
  }
  details.fw summary::-webkit-details-marker { display: none; }
  details.fw summary small { font-weight: normal; opacity: .85; font-size: 12px; }
  details.fw summary::after { content: '＋'; font-weight: normal; }
  details.fw[open] summary::after { content: '－'; }
  .fw-body { padding: 8px 14px 12px; font-size: 14px; }
  .fw-body .t2 { font-weight: bold; margin-top: 6px; }
  .fw-body .t2 small { color: var(--muted); font-weight: normal; }
  .fw-body .t3 { display: flex; flex-wrap: wrap; gap: 4px; margin: 3px 0 2px; }
  .fw-body .t3 span { font-size: 12px; background: #f4f1ea; border-radius: 4px; padding: 1px 7px; }
  .fw-body .t3 span small { color: var(--muted); }
  .quiz-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .quiz-row button {
    font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  .quiz-row button.ok { background: var(--green); color: #fff; border-color: var(--green); }
  .quiz-row button.ng { background: #f7d9dd; border-color: #e8a5ae; }
  #quiz-q { font-weight: bold; margin-top: 6px; }
  #quiz-a { font-size: 14px; color: var(--muted); min-height: 1.5em; margin-top: 6px; }
  .hide-ans .ans { color: transparent; background: repeating-linear-gradient(45deg, #f4f1ea, #f4f1ea 6px, #ece8de 6px, #ece8de 12px); border-radius: 4px; cursor: pointer; }
  .hide-ans .ans.peek { color: inherit; background: none; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  .foot { font-size: 12px; color: var(--muted); margin-top: 24px; line-height: 1.7; }
  .foot a { color: var(--green); }
</style>
</head>
<body>
<header>

  <p>わからない用語・覚えにくいところのまとめ。新しい用語はどんどん追加していきます。</p>
  <div class="tools">
    <input id="q" type="search" placeholder="用語をさがす">
    <button id="hide">「一言で」をかくす</button>
  </div>
  <div class="tools" id="cats"></div>
</header>
<main id="main"></main>

<script>

      html: `

      photos: [

      short: 'コーヒーチェリーから「種（生豆）」を取り出すやり方。どの皮を、いつ、どうやってはがすかがちがう。',
      html: `

        <p style="margin:0 0 6px;font-size:14px">コーヒー豆は、さくらんぼのような実（チェリー）の<b>種</b>。外から順に、何枚も皮に包まれています。加工法は「この皮を、どの順番で、どうやってはがすか」のちがいです。</p>

          <ellipse cx="156" cy="125" rx="29" ry="58" fill="#9db37f" stroke="#c7cfd2" stroke-width="2.5"/>

            <line x1="205" y1="55" x2="300" y2="30" stroke="#999"/><text x="306" y="35"><tspan font-weight="bold" fill="#c8102e">① 果皮</tspan>　いちばん外の赤い皮</text>
            <line x1="205" y1="85" x2="300" y2="70" stroke="#999"/><text x="306" y="75"><tspan font-weight="bold" fill="#d9705a">② 果肉</tspan>　甘い実の部分（パルプ）</text>
            <line x1="196" y1="110" x2="300" y2="110" stroke="#999"/><text x="306" y="115"><tspan font-weight="bold" fill="#b5893a">③ ミューシレージ</tspan>　ぬるぬるの粘液</text>
            <line x1="186" y1="150" x2="300" y2="150" stroke="#999"/><text x="306" y="155"><tspan font-weight="bold" fill="#9a7b45">④ パーチメント</tspan>　うすい殻</text>
            <line x1="165" y1="180" x2="300" y2="190" stroke="#999"/><text x="306" y="195"><tspan font-weight="bold" fill="#7d8a8f">⑤ シルバースキン</tspan>　銀色のうす皮</text>

        </ol>

        <h3>いちばん内側の9つ（タップすると中が見られます）</h3>
        <div class="wheel-guide" id="wheel"></div>

        <h3>スターバックスの豆で練習</h3>

        <div class="quiz-row"><button id="quiz-next">次の問題</button></div>`,
      tip: '<b>覚え方（内側の9つ）：</b>「<b>甘・花・果・酸</b>（あまはなかさん）、<b>葉・他・炒・辛・豆</b>（はたいりからまめ）」。甘み・花・果物・サワー/発酵／葉野菜/植物・その他・ロースト・スパイス・ナッツ/ココア。',

  // ───────── フレーバーホイール（SCA/WCR 2016 の項目。日本語は意訳） ─────────

  const quiz = [

  let qi = -1;
