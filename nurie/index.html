<style>
  @page { size: A4 portrait; margin: 0; }
  @page yoko { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e5df; color: #222; font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif; }
  .bar { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 12px 16px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .bar h1 { font-size: 18px; margin: 0 12px 0 0; }
  .bar button { font: inherit; font-weight: 800; font-size: 15px; padding: 10px 16px; border: 0; border-radius: 999px; background: #1e3932; color: #fff; cursor: pointer; }
  .bar button.sub { background: #d4e9e2; color: #1e3932; }
  .sheet { width: min(210mm, calc(100vw - 32px)); aspect-ratio: 210 / 297; margin: 20px auto; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .sheet.yoko { width: min(297mm, calc(100vw - 32px)); aspect-ratio: 297 / 210; }
  .label { text-align: center; font-weight: 800; margin-top: 24px; }
  .art { display: block; width: 100%; height: 100%; }
  .art text { font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif; }
  .art .title { font-size: 58px; font-weight: 800; stroke-width: 3.5; letter-spacing: 2px; }
  .art .small { font-size: 24px; font-weight: 800; fill: #111; stroke: none; }
  .art .lbl { font-size: 28px; font-weight: 800; fill: #111; stroke: none; }
  .art .sign { font-size: 32px; font-weight: 800; stroke-width: 2.2; }
  .art .menu { font-size: 28px; font-weight: 800; fill: #111; stroke: none; }
  .art .sign2 { font-size: 28px; font-weight: 800; stroke-width: 2; }
  .art .dt { font-size: 24px; font-weight: 800; fill: #111; stroke: none; letter-spacing: 2px; }
  @media print {
    body { background: #fff; }
    .bar, .label { display: none; }
    .sheet { width: 210mm; height: 297mm; margin: 0; box-shadow: none; page-break-after: always; break-after: page; }
    .sheet:last-of-type { page-break-after: auto; break-after: auto; }
    .sheet.yoko { width: 297mm; height: 210mm; page: yoko; }
    body[class^="only-"] .sheet { display: none; }
    body.only-easy #easy, body.only-normal #normal, body.only-yoko #yoko { display: block; }
  }
</style>
